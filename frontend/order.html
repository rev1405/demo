<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MallHaul - Order Tracking</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="order">
  <header id="site-header">
    <h1>MallHaul</h1>
  </header>

  <main id="main">
    <h2>Track Your Order</h2>
    <form id="track-order-form" method="GET" action="/track_order">
      <label for="order_id">Enter Order ID:</label>
      <input type="text" id="order_id" name="order_id" required>
      <button type="submit">Track</button>
    </form>

    <section id="order-status">
      <!-- Example order status card -->
      <article class="order-card">
        <h3>Order #12345</h3>
        <p>Status: <span class="status">Delivered</span></p>
        <p>Buyer: Alice</p>
        <p>Runner: Bob</p>
        <p>Item: Sneakers</p>
      </article>
    </section>
  </main>

  <footer id="site-footer">
    <p>&copy; 2026 MallHaul</p>
  </footer>

  <div id="toast"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
